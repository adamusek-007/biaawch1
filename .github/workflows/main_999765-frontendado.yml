name: Build and deploy Node.js app to Azure Web App - cloud-task-manager-frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build
        run: |
          npm install
          npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: "Tu wstaw adres swojego backendu np. https://99765-adasiek-a4a7d8e6gqcbgraq.polandcentral-01.azurewebsites.net/api"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5FE360AB521141DE8DA82618369C10E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2D9D07043FE94F10992C561137D0A3E7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_147C8406FB644791AFB4B086A89E036F }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: '999765-frontendado'
          package: dist
          startup-command: "pm2 serve /home/site/wwwroot --no-daemon --spa"
 